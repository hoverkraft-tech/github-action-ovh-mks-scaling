version: 2
updates:
  - package-ecosystem: github-actions
    commit-message:
      prefix: build
      include: scope
    directory: /
    open-pull-requests-limit: 20
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: friday
      time: "04:00"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    commit-message:
      prefix: build
      include: scope
    directory: "/"
    open-pull-requests-limit: 20
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: friday
      time: "04:00"
    groups:
      docker-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    commit-message:
      prefix: build
      include: scope
    directory: "/"
    open-pull-requests-limit: 20
    cooldown:
      default-days: 7
    versioning-strategy: increase
    schedule:
      interval: weekly
      day: friday
      time: "04:00"
    groups:
      npm-dev-dependencies:
        dependency-type: development
      actions-dependencies:
        patterns:
          - "@actions/*"

  - package-ecosystem: "devcontainers"
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 20
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: weekly
      day: friday
      time: "04:00"
    groups:
      devcontainers-dependencies:
        patterns:
          - "*"
