version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 20
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: friday
      time: "04:00"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/"
    open-pull-requests-limit: 20
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: friday
      time: "04:00"
    groups:
      docker-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/"
    open-pull-requests-limit: 20
    cooldown:
      default-days: 7
    versioning-strategy: increase
    schedule:
      interval: weekly
      day: friday
      time: "04:00"
    groups:
      npm-dev-dependencies:
        dependency-type: development
      actions-dependencies:
        patterns:
          - "@actions/*"

  - package-ecosystem: "devcontainers"
    open-pull-requests-limit: 20
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: weekly
      day: friday
      time: "04:00"
