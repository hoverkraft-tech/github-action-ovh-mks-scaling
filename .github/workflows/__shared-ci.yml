name: Common Continuous Integration tasks

on:
  workflow_call:

permissions: {}

jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@2fa562bd44f9e752a99a374c85ae14644e7f2bdd # 4.2.2
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write

  check-nodejs:
    name: Test nodejs
    needs: linter
    uses: $/.github/workflows/__check-nodejs.yml
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write

  check-dist:
    name: Test nodejs
    needs: linter
    uses: $/.github/workflows/__check-dist.yml
    permissions:
      contents: read
