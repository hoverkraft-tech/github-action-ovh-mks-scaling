# Publish this GitHub Action manually or every Monday at 08:25 UTC.
# Run `gh workflow run release.yml --ref main`, or select Release in Actions.
# Only the default branch can start a release. Conventional Commits determine the
# version; `force` bypasses only the no-changes guard. Existing tags are never moved
# by release planning. The shared CI checks the selected commit and its committed
# JavaScript bundles before publication.
#
# The organization supplies CI_BOT_APP_CLIENT_ID and CI_BOT_APP_PRIVATE_KEY. The
# App needs contents write and pull requests read permissions. Its token lets the
# release tag trigger the existing documentation workflow.
# OPENAI_API_KEY enables the organization's AI release summary.
# Summary failures prevent publication.
# Release notes live on GitHub; no CHANGELOG.md is maintained.
#
# If publication fails, rerun the failed job for the same planned tag and commit.
# For a source correction, merge the fix and start a new release from main.
name: Release

on:
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7: force only bypasses change detection; the source and validation stay fixed.
    inputs:
      force:
        description: Release even when no relevant changes are detected
        type: boolean
        default: false
  schedule:
    - cron: "25 8 * * 1"

permissions: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-release: ${{ steps.plan.outputs.should-release }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - id: plan
        uses: hoverkraft-tech/ci-github-publish/actions/release/plan@d034b96d52f6f32c58a93bcd87a06932f50d8b26 # 3.1.0
        with:
          target-ref: ${{ github.sha }}
          force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}

  validate:
    needs: plan
    if: needs.plan.outputs.should-release == 'true'
    uses: $/.github/workflows/__shared-ci.yml
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write

  release:
    needs: [plan, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env] release identity triggers tag documentation
          permission-contents: write
          permission-pull-requests: read

      - name: Publish release and AI summary
        uses: hoverkraft-tech/ci-github-publish/actions/release/create@d034b96d52f6f32c58a93bcd87a06932f50d8b26 # 3.1.0
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # zizmor: ignore[secrets-outside-env] summary credential stays scoped to publication
        with:
          tag: ${{ needs.plan.outputs.tag }}
          target-ref: ${{ github.sha }}
          changelog-summary: ${{ format('{{"llmAuth":{0},"llmProvider":"openai"}}', toJSON(env.OPENAI_API_KEY)) }}
          github-token: ${{ steps.generate-token.outputs.token }}
