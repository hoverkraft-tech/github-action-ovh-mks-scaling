name: Internal - Rebuild action distributions

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  distributions:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/action-distributions.yml@c63b4ce928082260ab263abc01faf3c1fa20c52b # 4.2.3
    permissions:
      actions: read
      contents: read
      pull-requests: read
    with:
      build-script: package
      # esbuild keeps dependency license comments in the bundle.
      required-files: index.js
      pull-request-authors: '["dependabot"]'
